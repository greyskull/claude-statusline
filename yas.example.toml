# yas.toml — yet-another-statusline configuration
#
# Copy this file to ~/.claude/yas.toml (or $CLAUDE_CONFIG_DIR/yas.toml) and
# uncomment the lines you want to change. Every knob below is shown commented
# out at its built-in default, so as-is this file changes nothing.
#
# Requires Python 3.11+ (the file is parsed with the stdlib `tomllib`). On
# Python 3.10 the file is silently skipped — environment variables work on
# every Python version.
#
# Precedence (highest wins): CLI flag → YAS_* env var → legacy-alias env var
# → this file → built-in default. So an environment variable always overrides
# the matching value here. (The one exception: a per-model `tokens.model`
# soft_limit override below beats the GLOBAL soft_limit from ANY source,
# including YAS_SOFT_LIMIT — specificity beats source precedence.)

# [layout]
# max_width = 140      # int > 0; max box width in columns (ignored when full_width = true)
# full_width = false   # bool; when true the box fills the terminal and ignores max_width
# labels = false       # bool; wide layout only — paint small superscript section
#                      #   labels into the border/separator rows above each value
#                      #   (clear/session, 5h/remain/used, input/cache/output, …).
#                      #   NOTE: distinct from [context].labels below, which is the
#                      #   five-word state list. Same key name, different section,
#                      #   different type. env: YAS_LABELS
# justify = false      # bool; wide layout only — align fields into columns instead
#                      #   of packing them left. env: YAS_JUSTIFY
# show_render_time = false  # bool; annotate the bottom-right border with the previous
#                           #   run's wall-clock render time (e.g. …47.2ms──╯). Blank on
#                           #   a session's first render. env: YAS_SHOW_RENDER_TIME
# show_tool_uses = false    # bool; wide layout only — show the per-tool tool_use
#                           #   counts row below the tokens/cost rows. env: YAS_SHOW_TOOL_USES
# show_tokens_over_time = false  # bool; wide layout only — add a full-width "tokens over
#                                #   time" row (t/m rate + sparkline) below the tokens/cost
#                                #   row. The tokens/cost row's trailing column now always
#                                #   shows skills + plugins. env: YAS_SHOW_TOKENS_OVER_TIME

# [tokens]
# soft_limit = 150000   # int > 0; tokens; context-fill bar / % threshold. Raise for 1M-context models.
# token_window = 60     # number > 0; seconds; rolling window for the token throughput (t/m) rate
# show_day_stats = true # bool; show today's cumulative token/cost totals alongside the
#                       #   session's, as session/day pairs. NOTE: this display toggle
#                       #   lives under [tokens], not [layout]. env: YAS_SHOW_DAY_STATS
#
# Per-model soft_limit overrides. `match` is a case-insensitive plain substring
# (no glob/regex) tested against the model id and display name. The LONGEST
# match wins; ties break by array order. A match here beats the global
# soft_limit from any source — including the YAS_SOFT_LIMIT env var. To single
# out a variant from its family, give the variant the longer, more specific
# match (below, "opus-4-8[1m]" outranks "opus" for the 1M-context model).
# model = [
#     { match = "opus",         soft_limit = 200000 },   # the whole Opus family
#     { match = "opus-4-8[1m]", soft_limit = 1000000 },  # 1M-context variant (longer match wins)
# ]

# [appearance]
# theme = "claude-dark"  # one of 14 built-in themes; unknown or unset falls back to
#                        #   claude-dark.
#                        #   Dark:  claude-dark, catppuccin-mocha, dracula, gruvbox-dark,
#                        #          nord, one-dark, solarized-dark, tokyo-night, palenight
#                        #   Light: claude-light, catppuccin-latte, gruvbox-light,
#                        #          one-light, solarized-light
# bg_shift = "warm"      # warm or cool; direction of the model-row gradient shift

# [appearance.glyphs]
# mode picks the richest glyph representation your terminal can display. All
# four modes preserve the box's column geometry. (env: YAS_GLYPH_MODE,
# CLI: --glyph-mode)
#   nerdfont — (default) display every glyph as-is. Full fidelity; needs a Nerd Font.
#   ascii    — replace every non-ASCII glyph with a width-1 ASCII equivalent. Maximum compatibility.
#   unicode  — replace only Nerd Font PUA icons with non-PUA Unicode; keep box/block/arrow glyphs. For good-Unicode-but-no-Nerd-Font terminals.
#   github   — GitHub-paste-safe: fold every glyph a browser renders double-wide to a width-1, EAW-narrow/ASCII stand-in, so a render stays column-aligned in a GitHub markdown code block.
# mode = "nerdfont"
#
# single_width folds double-width chars (wide emoji, CJK) in dynamic content to
# width-1, for fonts that render some glyphs double-width. It is an orthogonal
# boolean and combines with any mode above. (env: YAS_GLYPH_SINGLE_WIDTH,
# CLI: --glyph-single-width)
# single_width = false
#
# show_icons, when false, drops essentially every icon/glyph the statusline
# draws, including the top-left home/folder glyph. The exceptions — glyphs that
# still render — are the task-plan checkboxes, the subagent status markers, and
# the box/border and workflow structural glyphs (frame, sparkline blocks,
# separators, row markers). Text and numbers still render; only the glyph
# beside each is omitted, and column/border alignment is preserved.
# (env: YAS_SHOW_ICONS)
# show_icons = true

# [context]
# Context state word — a morphing Smart -> Coasting -> Foggy -> Cooked -> Dumb
# label on the context line, naming how full the window is. Off by default.
# Ported from Dumbometer (https://github.com/MaximoCorrea1/dumbometer, MIT); see
# NOTICE. The word is driven by the soft-limit fill ratio, so it agrees with the
# context bar. (env: YAS_CONTEXT_STATE / YAS_CONTEXT_LABELS / YAS_CONTEXT_THRESHOLDS)
# state = false
# labels = ["Smart", "Coasting", "Foggy", "Cooked", "Dumb"]  # exactly 5 non-empty words
#                                                            # NOTE: this is [context].labels,
#                                                            # NOT [layout].labels above.
# thresholds = [25, 50, 70, 90]                              # exactly 4 ascending ints, 1..99

# [openspec]
# scan_depth = 1  # int >= 0; repo-levels below cwd the OpenSpec downward scan
#                 #   descends looking for nested openspec/ roots (monorepo-of-repos
#                 #   layout). 1 (default) finds a repo directly below cwd; 2 also
#                 #   finds one nested a level deeper; 0 disables the downward scan
#                 #   entirely (only an openspec/ found by walking upward from cwd
#                 #   is used). Unlike most numeric knobs here, 0 is legal.
#                 #   env: YAS_OPENSPEC_SCAN_DEPTH

# [cache]
# transcript_cache = true  # bool; persist per-transcript parse results between renders (disable to force a full re-parse every tick)

# [rate_limits]
# Opt-in simulator for the 5h/7d usage buckets, for setups where Claude Code's
# stdin JSON doesn't supply `rate_limits` at all. Defining a bucket here
# synthesises it from local token-usage history and OVERRIDES any real
# payload value for that bucket; omitting a bucket leaves it driven by the
# stdin payload as before (or `∞`/omitted if that's absent too). No default —
# both are unset unless you add them.
#
# The signal driving this is each session's LIFETIME transcript totals
# (input, cache_creation, cache_read, output tokens, summed across every
# assistant message) -- monotonic for the life of a session, unlike the raw
# payload's context_window fields, which only describe the single most
# recent request and can DROP on /compact or /clear. When summing a
# session's usage within a window, the four components are weighted before
# being added together (input 1.0, cache_creation 1.25, cache_read 0.1,
# output 1.0) -- these mirror the public API's cache-pricing ratios, but
# Anthropic does NOT document how Max's 5h/7d windows actually weight cache
# tokens internally, so treat this as a reasonable assumption, not a fact.
#
# five_hour = { budget = 44_000_000, window = "5h", anchor = "rolling" }
# seven_day = { budget = 440_000_000, window = "7d", anchor = "fixed", epoch = "0 0 * * 0" }
#
# budget: int > 0; token budget for the window.
# window: duration string like "5h" or "7d".
# anchor: "rolling" (account-wide window anchored at first activity not
#         already inside a live window, shared by every concurrent session --
#         it runs its FULL `window` length regardless of idle time, and
#         resets_at counts down until it actually elapses, at which point the
#         next tick's activity opens a fresh window) or "fixed" (aligned to a
#         cron `epoch`).
# epoch:  standard 5-field cron expression; required when anchor = "fixed",
#         forbidden when anchor = "rolling".
